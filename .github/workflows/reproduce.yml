name: Reproduce analysis

on:
  push:
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r Requirements.txt
      - name: Run analysis
        run: python main.py
      - name: Verify key artifacts
        run: test -s Output/final_results_table.txt && test -s Figures/02_time_series.png
